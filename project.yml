name: NeonReels
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.neonreels
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  NeonReels:
    type: application
    platform: iOS
    sources:
    - Black
    - NeonReels
    - WidgetShared
    resources:
    - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonreels.puzzle
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Neon Reels
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        INFOPLIST_FILE: Support/AppInfo.plist
    dependencies:
    - target: NeonReelsWidget
      embed: true
  NeonReelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - NeonReelsTests
    dependencies:
    - target: NeonReels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  NeonReelsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - NeonReelsUITests
    - WidgetTests/WidgetIntegrationTests.swift
    dependencies:
    - target: NeonReels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  NeonReelsWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonreels.puzzle.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
  NeonReelsWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    dependencies:
    - target: NeonReels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.neonreels.puzzle.widgettests
schemes:
  NeonReels:
    build:
      targets:
        NeonReels: all
    test:
      targets:
      - NeonReelsTests
      - NeonReelsUITests
      - NeonReelsWidgetTests
